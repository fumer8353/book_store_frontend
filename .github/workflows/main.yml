name: Deploy React App to GitHub Pages

on:
  push:
    branches: [ main ]   # runs when we push to the 'main' branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest   # the robot’s clean computer

    steps:
      - name: 📥 Get the code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18   # or 20, whichever you use locally

      - name: 📦 Install dependencies
        run: npm ci          # faster and stricter than 'npm install'

      - name: 🏗️ Build the app
        run: npm run build

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist   # for CRA, or './dist' if using Vite
